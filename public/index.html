<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noe Agent</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <nav class="rail">
      <div class="rail-drag"></div>
      <div class="logo" title="Noe Agent"><img src="icon.svg" alt=""></div>
      <button class="rail-btn active" data-view="chat" title="聊天 ⌘1">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>聊天</span>
      </button>
      <button class="rail-btn" data-view="tools" title="AI 工具 ⌘2">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg><span>工具</span>
      </button>
      <button class="rail-btn" data-view="providers" title="模型厂商 ⌘3">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M14.5 8.5l2 2"/></svg><span>厂商</span>
      </button>
      <button class="rail-btn" data-view="ext" title="MCP 与插件 ⌘4">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3h4v2a2 2 0 1 0 4 0V3h3v7h-2a2 2 0 1 0 0 4h2v7h-7v-2a2 2 0 1 0-4 0v2H3v-7h2a2 2 0 1 0 0-4H3V3z"/></svg><span>扩展</span>
      </button>
      <button class="rail-btn" data-view="settings" title="设置 ⌘5">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>设置</span>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-btn small" id="rail-term" title="终端 ⌘J">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>
        <b class="rail-badge hidden" id="term-badge"></b>
      </button>
      <button class="rail-btn small" id="rail-theme" title="切换深色 / 浅色">
        <svg class="i sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>

    <div class="main">
      <div class="views">
        <section class="view" id="view-chat">
          <aside class="sidebar">
            <div class="side-head">
              <div class="search"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="search" placeholder="搜索" autocomplete="off"><kbd>⌘K</kbd></div>
              <button class="icon-btn" id="btn-new-group" title="新建群聊 ⌘N"><svg class="i" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
            <div class="side-scroll">
              <div class="side-title"><span>AI 助手</span><small>拖进群聊即可拉人</small></div>
              <div id="agent-list"></div>
              <div class="side-title"><span>群聊 <em id="group-count"></em></span></div>
              <div id="group-list"></div>
              <div class="drop-new" id="drop-new">
                <svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"/></svg>
                <span>把 AI 拖到这里新建群聊</span>
              </div>
            </div>
          </aside>
          <main class="chat" id="chat"></main>
        </section>
        <section class="view hidden" id="view-tools"></section>
        <section class="view hidden" id="view-providers"></section>
        <section class="view hidden" id="view-ext"></section>
        <section class="view hidden" id="view-settings"></section>
      </div>
      <div class="term-drawer hidden" id="term-drawer"></div>
    </div>
  </div>
  <div class="offline hidden" id="offline">与本地服务的连接已断开，正在重连…</div>
  <div id="toasts"></div>

  <script src="vendor/vendor.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
