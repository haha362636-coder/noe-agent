<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- 灰白配色：石墨渐变底 + 月白 N，和应用内 logo 一致 -->
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46464c"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="n" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- macOS 图标网格：824px 主体，四周留白 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)" filter="url(#s)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="url(#h)" stroke="#fff" stroke-opacity=".1" stroke-width="4"/>
  <path d="M352 704V320l320 384V320" fill="none" stroke="url(#n)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
